<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short video study</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20252d;background:#f5f6f8;margin:0}main{max-width:920px;margin:24px auto;padding:24px 32px;background:white;border-radius:18px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:18px 0 8px}p{margin:8px 0}.muted{color:#626b78;font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}progress{width:100%;height:6px;accent-color:#356fd6;margin:14px 0}video{display:block;width:100%;height:300px;background:#14171d;border-radius:10px;object-fit:contain}button{font:inherit;cursor:pointer;background:#fff;color:#28303d;border:1px solid #cdd3dc;border-radius:8px;padding:10px 15px}button.primary{background:#2864c6;color:white;border-color:#2864c6}button:disabled{opacity:.5;cursor:default}.choices{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.choice{position:relative;cursor:pointer;font-size:14px;text-align:center;min-height:55px}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:flex;align-items:center;justify-content:center;height:100%;padding:10px 5px;border:1px solid #ced5df;border-radius:8px}.choice input:checked+span{background:#eaf2ff;border:2px solid #2864c6;color:#174f9d}.choice input:focus-visible+span{outline:3px solid #97b6e7}textarea{width:100%;padding:8px;font:inherit;border:1px solid #cdd3dc;border-radius:6px}details{margin:14px 0}summary{cursor:pointer;color:#626b78;font-size:14px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.downloads{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.error{color:#a82c29}.saved{color:#487153}ul{padding-left:21px}#welcome{padding:24px 0}@media(max-width:650px){main{margin:0;padding:20px 16px;border-radius:0}.choices{grid-template-columns:repeat(3,1fr)}video{height:230px}.top{align-items:flex-start}}
</style></head><body><main id="app"></main>
<script>
'use strict';
const cfg={"study_id": "human_audio_gain_20260910", "version": "1.0", "assignment_id": "A025", "items": [{"item_id": "item_5fa6e585557843cf89a8", "media": "a1fd570e5440432c818a.mp4", "duration_s": 10.008005}, {"item_id": "item_169ca996e1cb4b0c9f89", "media": "0e0557efd64140f58e5a.mp4", "duration_s": 10.008005}, {"item_id": "item_c4fb0d9811cf4a35acc2", "media": "9d6cf097d48d429fa9eb.mp4", "duration_s": 10.0}, {"item_id": "item_5336e4b767a1490bbe6b", "media": "2342ccf85a064273a67c.mp4", "duration_s": 10.008005}, {"item_id": "item_7a0a5caa6e8345159983", "media": "c19ea675dabd4a519f66.mp4", "duration_s": 10.0}, {"item_id": "item_df04c0523e4c40f7aa6f", "media": "172c9d3ee64f48c2abfb.mp4", "duration_s": 9.9099}, {"item_id": "item_e324628bc3da47e4a22c", "media": "a70052e295654aa1a464.mp4", "duration_s": 10.008005}, {"item_id": "item_34db8106add14ddd934f", "media": "28861365a8f0458ab100.mp4", "duration_s": 10.008005}, {"item_id": "item_b20d54c86f8c49958a44", "media": "150037c027ae4071aa74.mp4", "duration_s": 10.008005}, {"item_id": "item_1dd54df8f4fb453bbc28", "media": "bbcff37980284061b3d2.mp4", "duration_s": 10.018005}, {"item_id": "item_ae6da9836de74d31862a", "media": "9ede011e781b4c1e87cf.mp4", "duration_s": 10.0}, {"item_id": "item_0131cc370c804803bb1b", "media": "d60d193e716f4d8e8c95.mp4", "duration_s": 10.009002}, {"item_id": "item_25b0b33aef0e4c2ba464", "media": "8005d61b4fe446948c3a.mp4", "duration_s": 10.016009}, {"item_id": "item_18b9f10cf0d547458e7d", "media": "e9ba63333ed844719958.mp4", "duration_s": 10.0}, {"item_id": "item_1b7381d9220f4f7881fb", "media": "e8b93b5fbe2349c0b44f.mp4", "duration_s": 10.0}, {"item_id": "item_9c73e09050314a6582a8", "media": "ba514616c8e24fd08fd9.mp4", "duration_s": 10.0}, {"item_id": "item_94867598e2e9435abd24", "media": "7cad1955dcce4b479112.mp4", "duration_s": 10.008005}, {"item_id": "item_9b83628b555a4457a112", "media": "dfe4886850c7439194fa.mp4", "duration_s": 10.008005}, {"item_id": "item_814fe395b8f54042aeb3", "media": "702b6b2eb1074c42b76e.mp4", "duration_s": 10.015011}, {"item_id": "item_0ab0b048abaf465a8b6c", "media": "e7e0c02fa40245cbb0b2.mp4", "duration_s": 9.24}, {"item_id": "item_433443b570b14c3eafc2", "media": "d8e6e1a637204673865e.mp4", "duration_s": 8.6086}, {"item_id": "item_9483503c25b74f538e44", "media": "cfa4d3de2d25491786ee.mp4", "duration_s": 10.008005}, {"item_id": "item_37c923a19ef64c4580d4", "media": "a751b6c0cc54446ab7b0.mp4", "duration_s": 10.008005}, {"item_id": "item_aa25c1f59a244043927a", "media": "472a38667bb741cd9fa4.mp4", "duration_s": 10.0}, {"item_id": "item_1829b8cbea7a46b58c95", "media": "92f3b3ee7525428e8e34.mp4", "duration_s": 10.008005}, {"item_id": "item_e31c882f84894f13a3cf", "media": "1a9d2dab1b024debbf77.mp4", "duration_s": 10.0}, {"item_id": "item_480eebb14a30412b8aac", "media": "534af14e46e943079e40.mp4", "duration_s": 10.008005}, {"item_id": "item_057236ea337f40b69aec", "media": "0ad92215f6a64c62934b.mp4", "duration_s": 10.008005}, {"item_id": "item_d64d76d5165e45109b9d", "media": "2c3a5b09c5d84400b431.mp4", "duration_s": 10.01}, {"item_id": "item_52dd4c7469ec4768b285", "media": "eed5ac9ce304425bb88b.mp4", "duration_s": 10.016009}]};
const key=cfg.study_id+'-'+cfg.version+'-'+cfg.assignment_id;
const fields=['study_id','version','assignment_id','item_id','noticeability','intelligibility','comment','technical_issue','play_count','ended','last_time_s','volume_initial','volume_last','saved_at'];
let storageOK=true,renderSerial=0,state={index:0,started:false,rows:{},drafts:{},volume:0.5};
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.rows&&saved.drafts)state=saved;}catch(e){storageOK=false;}
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){storageOK=false;}const msg=document.getElementById('saveMsg');if(msg){msg.textContent=storageOK?'Saved in this browser. Download your files when finished.':'Browser saving is unavailable. Keep this page open and download a backup now.';msg.className=storageOK?'muted saved':'error';}}
function download(kind){
 const rows=cfg.items.filter(x=>state.rows[x.item_id]).map(x=>state.rows[x.item_id]);
 const safeCSV=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
 const data=kind==='json'?JSON.stringify({study_id:cfg.study_id,version:cfg.version,assignment_id:cfg.assignment_id,completed:rows.length,total:cfg.items.length,responses:rows},null,2):'\ufeff'+[fields.map(safeCSV).join(','),...rows.map(r=>fields.map(k=>safeCSV(r[k])).join(','))].join('\r\n');
 const url=URL.createObjectURL(new Blob([data],{type:kind==='json'?'application/json':'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download=cfg.assignment_id+'_responses.'+kind;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadButtons(){return '<div class="downloads"><button id="csv">Download CSV</button><button id="json">Download JSON</button></div><p id="saveMsg" class="muted"></p>';}
function wireDownloads(){document.getElementById('csv').onclick=()=>download('csv');document.getElementById('json').onclick=()=>download('json');persist();}
function welcome(){app.innerHTML='<p class="muted">'+esc(cfg.assignment_id)+' · 30 short clips</p><h1>Watch. Listen. Two quick ratings.</h1><div id="welcome"><ul><li>Some clips contain an added voice; others do not.</li><li>Rate how noticeable that voice is and how much you understand.</li><li>No added voice? Choose <b>None</b> for both. Unsure? Choose <b>Not sure</b>.</li><li>Use a comfortable, steady volume. Lower it or stop if it feels too loud.</li></ul><p class="muted">About 15–20 minutes. You can pause and return in this browser. No name or email needed.</p><p>At the end, download your responses and send them privately to your coordinator.</p><button id="start" class="primary">Start</button></div>';document.getElementById('start').onclick=()=>{state.started=true;persist();render();};}
function choices(name,labels,value){return '<div class="choices">'+labels.map((label,i)=>{const val=i===5?'unsure':String(i);return '<label class="choice"><input type="radio" name="'+name+'" value="'+val+'" '+(value===val?'checked':'')+'><span>'+label+'</span></label>';}).join('')+'</div>';}
function render(){
 const serial=++renderSerial;
 if(!state.started)return welcome();
 if(state.index>=cfg.items.length){app.innerHTML='<p class="muted">'+esc(cfg.assignment_id)+'</p><h1>All done. Thank you!</h1><p>'+Object.keys(state.rows).length+' / '+cfg.items.length+' clips saved.</p><p><b>Download both files</b> and send them privately to your coordinator. Nothing has been uploaded automatically.</p>'+downloadButtons()+'<p><button id="review">Review my answers</button></p>';wireDownloads();document.getElementById('review').onclick=()=>{state.index=0;render();};return;}
 const item=cfg.items[state.index],old=state.drafts[item.item_id]||state.rows[item.item_id]||{};
 let events={play_count:old.play_count||0,ended:old.ended||false,last_time_s:old.last_time_s||0,volume_initial:old.volume_initial??state.volume,volume_last:state.volume};
 app.innerHTML='<div class="top"><h1>Listen to this clip</h1><span class="muted">'+esc(cfg.assignment_id)+' · '+(state.index+1)+' / '+cfg.items.length+'</span></div><progress value="'+Object.keys(state.rows).length+'" max="30"></progress><video id="video" controls playsinline preload="metadata" src="../media/'+esc(item.media)+'"></video><p id="mediaError" class="error"></p><h2>1. How noticeable was the added voice?</h2>'+choices('noticeability',['None','Barely','Slightly','Clearly','Very obvious','Not sure'],old.noticeability)+'<h2>2. How much of it could you understand?</h2>'+choices('intelligibility',['None','A voice,<br>no words','A few words','Most words','All words','Not sure'],old.intelligibility)+'<details><summary>Quick reminder / optional comment</summary><p class="muted">Rate only the added voice, not video quality or whether the words are true. No added voice? Choose None for both. Replays are okay.</p><textarea id="comment" rows="2" maxlength="1000" placeholder="Anything we should know? (optional)">'+esc(old.comment||'')+'</textarea></details><div class="actions"><button id="back" '+(state.index===0?'disabled':'')+'>Back</button><button id="skip">Playback problem — skip</button><button id="next" class="primary">Save & next</button></div><p id="formError" class="error"></p>'+downloadButtons();
 const v=document.getElementById('video');v.volume=state.volume;
 function current(){return {study_id:cfg.study_id,version:cfg.version,assignment_id:cfg.assignment_id,item_id:item.item_id,noticeability:document.querySelector('input[name="noticeability"]:checked')?.value??'',intelligibility:document.querySelector('input[name="intelligibility"]:checked')?.value??'',comment:document.getElementById('comment').value,technical_issue:false,...events,saved_at:new Date().toISOString()};}
 function draft(){if(serial!==renderSerial)return;state.drafts[item.item_id]=current();persist();}
 v.addEventListener('play',()=>{events.play_count++;draft();});v.addEventListener('ended',()=>{events.ended=true;events.last_time_s=v.currentTime;draft();});v.addEventListener('pause',()=>{events.last_time_s=Math.max(events.last_time_s,v.currentTime);draft();});
 v.addEventListener('volumechange',()=>{state.volume=v.volume;events.volume_last=v.volume;draft();});v.addEventListener('error',()=>{document.getElementById('mediaError').textContent='This clip could not load. Please use Playback problem — skip.';});
 for(const r of document.querySelectorAll('input[type="radio"]'))r.addEventListener('change',draft);
 document.getElementById('comment').addEventListener('input',draft);
 function next(technical){const row=current();row.last_time_s=Math.max(row.last_time_s,v.currentTime);if(!technical&&(!row.noticeability||!row.intelligibility)){document.getElementById('formError').textContent='Please answer both questions, or choose Not sure.';return;}if(!technical&&row.play_count===0){document.getElementById('formError').textContent='Please play the clip first, or skip it if playback does not work.';return;}row.technical_issue=technical;if(technical){row.noticeability='';row.intelligibility='';}state.rows[item.item_id]=row;state.drafts[item.item_id]=row;state.index++;persist();render();}
 document.getElementById('next').onclick=()=>next(false);document.getElementById('skip').onclick=()=>next(true);
 document.getElementById('back').onclick=()=>{draft();state.index--;persist();render();};wireDownloads();
}
render();
</script></body></html>
