<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short video study</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20252d;background:#f5f6f8;margin:0}main{max-width:920px;margin:24px auto;padding:24px 32px;background:white;border-radius:18px}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px;margin:18px 0 8px}p{margin:8px 0}.muted{color:#626b78;font-size:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}progress{width:100%;height:6px;accent-color:#356fd6;margin:14px 0}video{display:block;width:100%;height:300px;background:#14171d;border-radius:10px;object-fit:contain}button{font:inherit;cursor:pointer;background:#fff;color:#28303d;border:1px solid #cdd3dc;border-radius:8px;padding:10px 15px}button.primary{background:#2864c6;color:white;border-color:#2864c6}button:disabled{opacity:.5;cursor:default}.choices{display:grid;grid-template-columns:repeat(var(--choice-columns,6),minmax(0,1fr));gap:8px}.choice{position:relative;cursor:pointer;font-size:14px;text-align:center;min-height:55px}.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:flex;align-items:center;justify-content:center;height:100%;padding:10px 5px;border:1px solid #ced5df;border-radius:8px}.choice input:checked+span{background:#eaf2ff;border:2px solid #2864c6;color:#174f9d}.choice input:focus-visible+span{outline:3px solid #97b6e7}textarea{width:100%;padding:8px;font:inherit;border:1px solid #cdd3dc;border-radius:6px}details{margin:14px 0}summary{cursor:pointer;color:#626b78;font-size:14px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.downloads{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.error{color:#a82c29}.saved{color:#487153}ul{padding-left:21px}#welcome{padding:24px 0}@media(max-width:650px){main{margin:0;padding:20px 16px;border-radius:0}.choices{grid-template-columns:repeat(3,minmax(0,1fr))}video{height:230px}.top{align-items:flex-start}}
</style><link rel="stylesheet" href="../ui-language.css">
<script src="../ui-language.js" defer></script>
</head><body><main id="app"></main>
<script>
'use strict';
const cfg={"study_id":"human_audio_environment_20260918_n60","version":"2.0","assignment_id":"C011","items":[{"item_id":"item_c40dbfc5f937424a940d","media":"fa9d6f4bd34843ddbb28.mp4","duration_s":10.009002},{"item_id":"item_838754f7c0af4fb0936f","media":"cd3febd6f24e4dcaa99a.mp4","duration_s":10.008005},{"item_id":"item_1cc41e789d1b4e18b244","media":"fa5fbd9d4b0a49ffb9c7.mp4","duration_s":10.008005},{"item_id":"item_24de926f8876422c86a5","media":"1b25a4581d024a2dabb3.mp4","duration_s":10.016009},{"item_id":"item_163647b23e694ceeb803","media":"8921c3f1f91348fd9fe8.mp4","duration_s":9.12},{"item_id":"item_b0f5b9e98e854c468840","media":"fb198cdfcc234e2ca773.mp4","duration_s":10.0},{"item_id":"item_2c4d581ef3a14bd3abe4","media":"6920f683d17c4d07b67e.mp4","duration_s":10.0},{"item_id":"item_413ef00d30804edfa102","media":"d9aa96838f6e477ba241.mp4","duration_s":10.0},{"item_id":"item_13dc82ba544b44afb5ab","media":"c17868a5c5934015b17b.mp4","duration_s":8.6086},{"item_id":"item_e466250e805c49788f51","media":"5f78feae3c614aabb53e.mp4","duration_s":10.015011},{"item_id":"item_1496a9e86af94c56941a","media":"a838478ce4264f83a90c.mp4","duration_s":10.008005},{"item_id":"item_ee9db70955b34db69ef4","media":"83e11957f7684a2d9f31.mp4","duration_s":9.04},{"item_id":"item_b5c68bf49b4b4d7ca5da","media":"62b4a7f4114b403a9cb2.mp4","duration_s":10.008005},{"item_id":"item_369ce82b41054feca810","media":"2f6c7afe493c4210aaa7.mp4","duration_s":10.007007},{"item_id":"item_a463e1309c7b471ea64c","media":"c91a32b24b354c4498d1.mp4","duration_s":10.016009},{"item_id":"item_807ee9034c20447c9c56","media":"e1837161908148b5bdd0.mp4","duration_s":9.433333},{"item_id":"item_295f23e9842349bdaeb5","media":"6482d5738db746979b82.mp4","duration_s":10.0},{"item_id":"item_b414d8accab34c59b65b","media":"a0f94532763b4828845e.mp4","duration_s":10.0},{"item_id":"item_d483c24e09c342b993fb","media":"0d8ff10a179c4626a353.mp4","duration_s":10.0},{"item_id":"item_e5b841bdfec44f8f8141","media":"8cdb36ca7f684e509fa8.mp4","duration_s":10.008005},{"item_id":"item_9ed5248275d04daca0fa","media":"ed2d3f61480d4a858be3.mp4","duration_s":10.000998},{"item_id":"item_9e1004fa0ab04ea5b050","media":"b93aae940bd64143b7d4.mp4","duration_s":10.008005},{"item_id":"item_ca93683aae4c4dd68b56","media":"b4e286d00c1e44fd94f1.mp4","duration_s":10.008005},{"item_id":"item_85b9545ee6ec45e7abf9","media":"4ffbb75386d448a38bd5.mp4","duration_s":10.01},{"item_id":"item_524ed2bdbd404af4b3cf","media":"a62a986b542f42ec9e39.mp4","duration_s":10.009002},{"item_id":"item_a9ff06ef183942f18431","media":"7ce4d61b84154f19bbcd.mp4","duration_s":10.008005},{"item_id":"item_01e0151949e24791bd04","media":"bf0d3a0be162454ea172.mp4","duration_s":10.008005},{"item_id":"item_33afc1c283044031bba2","media":"9c604f3fb763467bb283.mp4","duration_s":10.0},{"item_id":"item_135035426d77456a8c59","media":"7f88022cd36f446186c4.mp4","duration_s":10.017007},{"item_id":"item_2af28ed6c09649eeadaa","media":"9ca375ed6b4d472d857d.mp4","duration_s":10.0}]};
const key=cfg.study_id+'-'+cfg.version+'-'+cfg.assignment_id;
const fields=['study_id','protocol_version','assignment_id','item_id','voice_detected','noticeability','intelligibility','comment','technical_issue','play_count','ended','last_time_s','volume_initial','volume_last','saved_at'];
let storageOK=true,renderSerial=0,state={index:0,started:false,rows:{},drafts:{},volume:0.5};
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.rows&&saved.drafts)state=saved;}catch(e){storageOK=false;}
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){storageOK=false;}const msg=document.getElementById('saveMsg');if(msg){msg.textContent=storageOK?'Saved in this browser. Download your files when finished.':'Browser saving is unavailable. Keep this page open and download a backup now.';msg.className=storageOK?'muted saved':'error';}}
function download(kind){
 const rows=cfg.items.filter(x=>state.rows[x.item_id]).map(x=>state.rows[x.item_id]);
 const safeCSV=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
 const data=kind==='json'?JSON.stringify({study_id:cfg.study_id,protocol_version:cfg.version,version:cfg.version,assignment_id:cfg.assignment_id,completed:rows.length,total:cfg.items.length,responses:rows},null,2):'\ufeff'+[fields.map(safeCSV).join(','),...rows.map(r=>fields.map(k=>safeCSV(r[k])).join(','))].join('\r\n');
 const url=URL.createObjectURL(new Blob([data],{type:kind==='json'?'application/json':'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download=cfg.assignment_id+'_v2.0_responses.'+kind;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadButtons(){return '<div class="downloads"><button id="csv">Download CSV</button><button id="json">Download JSON</button></div><p id="saveMsg" class="muted"></p>';}
function wireDownloads(){document.getElementById('csv').onclick=()=>download('csv');document.getElementById('json').onclick=()=>download('json');persist();}
function welcome(){app.innerHTML='<p class="muted">'+esc(cfg.assignment_id)+' · 30 short clips</p><h1>Watch. Listen. Two quick ratings.</h1><div id="welcome"><ul><li>Some clips contain a voice that may have been added; others do not.</li><li>Answer whether you noticed an added voice, then how much of that speech you understood.</li><li>Start playback, then answer whenever ready. You do not need to finish the clip. Replays are okay.</li><li>Use a comfortable, steady volume. Lower it or stop if it feels too loud.</li></ul><p class="muted">About 15–20 minutes. You can pause and return in this browser. No name or email needed.</p><p>At the end, download your responses and send them privately to your coordinator.</p><button id="start" class="primary">Start</button></div>';document.getElementById('start').onclick=()=>{state.started=true;persist();render();};}
function choices(name,labels,value){return '<div class="choices" style="--choice-columns:'+Math.min(labels.length,5)+'">'+labels.map(label=>{const val=label[0];return '<label class="choice"><input type="radio" name="'+name+'" value="'+val+'" '+(value===val?'checked':'')+'><span>'+label[1]+'</span></label>';}).join('')+'</div>';}
function render(){
 const serial=++renderSerial;
 if(!state.started)return welcome();
 if(state.index>=cfg.items.length){app.innerHTML='<p class="muted">'+esc(cfg.assignment_id)+'</p><h1>All done. Thank you!</h1><p>'+Object.keys(state.rows).length+' / '+cfg.items.length+' clips saved.</p><p><b>Download both files</b> and send them privately to your coordinator. Nothing has been uploaded automatically.</p>'+downloadButtons()+'<p><button id="review">Review my answers</button></p>';wireDownloads();document.getElementById('review').onclick=()=>{state.index=0;render();};return;}
 const item=cfg.items[state.index],old=state.drafts[item.item_id]||state.rows[item.item_id]||{};
 let events={play_count:old.play_count||0,ended:old.ended||false,last_time_s:old.last_time_s||0,volume_initial:old.volume_initial??state.volume,volume_last:state.volume};
 app.innerHTML='<div class="top"><h1>Listen to this clip</h1><span class="muted">'+esc(cfg.assignment_id)+' · '+(state.index+1)+' / '+cfg.items.length+'</span></div><progress value="'+Object.keys(state.rows).length+'" max="30"></progress><video id="video" controls playsinline preload="metadata" src="../media/'+esc(item.media)+'"></video><p id="mediaError" class="error"></p><h2>1. Did you notice a voice that seemed to have been added?</h2>'+choices('voice_detected',[['no','No'],['unsure','Not sure'],['yes','Yes']],old.voice_detected)+'<div id="noticeabilityWrap"><h2>If yes, how noticeable was it?</h2>'+choices('noticeability',[['barely','Barely'],['slightly','Slightly'],['clearly','Clearly'],['very_obvious','Very obvious']],old.noticeability)+'</div><h2>2. How much of that speech could you understand?</h2>'+choices('intelligibility',[['not_noticed','Did not notice speech'],['voice_no_words','Heard a voice, no words'],['some_words','Some words'],['most_words','Most words'],['all_words','All words']],old.intelligibility)+'<details><summary>Quick reminder / optional comment</summary><p class="muted">Answer Q1 and Q2 independently. If you are unsure whether a voice was added, choose Not sure for Q1. For Q2, choose the speech level that matches what you heard.</p><textarea id="comment" rows="2" maxlength="1000" placeholder="Anything we should know? (optional)">'+esc(old.comment||'')+'</textarea></details><div class="actions"><button id="back" '+(state.index===0?'disabled':'')+'>Back</button><button id="skip">Playback problem — skip</button><button id="next" class="primary">Save & next</button></div><p id="formError" class="error"></p>'+downloadButtons();
 const v=document.getElementById('video');v.volume=state.volume;
 function current(){const detected=document.querySelector('input[name="voice_detected"]:checked')?.value??'';return {study_id:cfg.study_id,protocol_version:cfg.version,version:cfg.version,assignment_id:cfg.assignment_id,item_id:item.item_id,voice_detected:detected,noticeability:detected==='yes'?(document.querySelector('input[name="noticeability"]:checked')?.value??''):'',intelligibility:document.querySelector('input[name="intelligibility"]:checked')?.value??'',comment:document.getElementById('comment').value,technical_issue:false,...events,saved_at:new Date().toISOString()};}
 function draft(){if(serial!==renderSerial)return;state.drafts[item.item_id]=current();persist();}
 v.addEventListener('play',()=>{events.play_count++;draft();});v.addEventListener('ended',()=>{events.ended=true;events.last_time_s=v.currentTime;draft();});v.addEventListener('pause',()=>{events.last_time_s=Math.max(events.last_time_s,v.currentTime);draft();});
 v.addEventListener('volumechange',()=>{state.volume=v.volume;events.volume_last=v.volume;draft();});v.addEventListener('error',()=>{document.getElementById('mediaError').textContent='This clip could not load. Please use Playback problem — skip.';});
 for(const r of document.querySelectorAll('input[type="radio"]'))r.addEventListener('change',draft);
 document.querySelectorAll('input[name="voice_detected"]').forEach(r=>r.addEventListener('change',()=>{document.getElementById('noticeabilityWrap').hidden=r.value!=='yes';draft();}));
 document.getElementById('noticeabilityWrap').hidden=old.voice_detected!=='yes';
 document.getElementById('comment').addEventListener('input',draft);
 function next(technical){const row=current();row.last_time_s=Math.max(row.last_time_s,v.currentTime);if(!technical&&(!row.voice_detected||!row.intelligibility||(row.voice_detected==='yes'&&!row.noticeability))){document.getElementById('formError').textContent='Please answer both questions; choose a noticeability level only when you selected Yes.';return;}if(!technical&&row.play_count===0){document.getElementById('formError').textContent='Please play the clip first, or skip it if playback does not work.';return;}row.technical_issue=technical;if(technical){row.voice_detected='';row.noticeability='';row.intelligibility='';}state.rows[item.item_id]=row;state.drafts[item.item_id]=row;state.index++;persist();render();}
 document.getElementById('next').onclick=()=>next(false);document.getElementById('skip').onclick=()=>next(true);
 document.getElementById('back').onclick=()=>{draft();state.index--;persist();render();};wireDownloads();
}
render();
</script></body></html>
