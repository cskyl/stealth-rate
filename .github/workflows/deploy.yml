name: Deploy StealthRate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r frontend/dist/. site/
          mkdir -p site/studies site/media
          for d in studies/*/; do
            s=$(basename "$d")
            mkdir -p "site/studies/$s"
            for f in items.json blocks.json study.json consent.md instructions.md debrief.md; do
              [ -f "$d/$f" ] && cp "$d/$f" "site/studies/$s/" || true
            done
          done
          [ -d media ] && cp -r media/. site/media/ || true
          # blinding guard: the public site must not carry the private key
          if find site -name 'key.json' | grep -q .; then echo "key.json leaked into site"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
